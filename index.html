<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger</title>
<style>
  :root { --paper: #EEF2E6; --ink: #1C2433; --pencil: #5F6858; --rule: #C0574E; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1B231E; --ink: #E6E2D3; --pencil: #9AA394; --rule: #7A3B35; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 38rem; padding: 48px 16px 48px 24px; margin: 0 auto; border-left: 3px double var(--rule); }
  h1 { font-weight: normal; font-size: 2.4rem; margin: 0 0 8px; }
  p { margin: 0 0 16px; }
  .small { color: var(--pencil); font-size: 0.9rem; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Ledger</h1>
  <p>Ledger is a personal expense tracker for Android. It records card purchases from bank alert notifications and bank alert emails, and keeps them on the phone.</p>
  <p>It is a private app for one person. It is not on the Play Store.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
  <p class="small">Last updated 23 October 2026.</p>
</main>
</body>
</html>
